# Tiny Tapeout project information
project:
  title:        "8-bit Universal Counter"
  author:       "Luu Quoc Vinh"
  discord:      ""
  description:  "8-bit universal binary counter with up/down, load, and hold functionality."
  language:     "Verilog"
  clock_hz:     10000000

  tiles:        "1x1"
  top_module:   "tt_um_d01_counter"

  source_files:
    - "tt_um_d01_counter.v"

pinout:
  ui[0]: "d_in[0]"
  ui[1]: "d_in[1]"
  ui[2]: "d_in[2]"
  ui[3]: "d_in[3]"
  ui[4]: "d_in[4]"
  ui[5]: "d_in[5]"
  ui[6]: "d_in[6]"
  ui[7]: "d_in[7]"

  uo[0]: "count[0]"
  uo[1]: "count[1]"
  uo[2]: "count[2]"
  uo[3]: "count[3]"
  uo[4]: "count[4]"
  uo[5]: "count[5]"
  uo[6]: "count[6]"
  uo[7]: "count[7]"

  uio[0]: "load"
  uio[1]: "up_down"
  uio[2]: "en"
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

yaml_version: 6
