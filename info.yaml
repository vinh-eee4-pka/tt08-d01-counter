# Tiny Tapeout project information
project:
  title:        "8-bit Universal Counter"
  author:       "Luu Quoc Vinh"
  discord:      ""
  description:  "8-bit universal binary counter with up/down, load, and hold functionality."
  language:     "Verilog"
  clock_hz:     0

  tiles:        "1x1"
  top_module:   "tt_um_d01_counter"

  source_files:
    - "tt_um_d01_counter.v"

  how_it_works: "An 8-bit binary counter with enable, up/down direction, and direct load inputs."
  how_to_test:  "Apply clock and reset_n high, toggle en/up_down/load pins to verify counting logic."
  external_hardware: "None"
  doc_link:     ""

pinout:
  ui_in:
    - "clk"
    - "rst_n"
    - "en"
    - "up_down"
    - "load"
    - "d_in[0]"
    - "d_in[1]"
    - "d_in[2]"
  uo_out:
    - "count[0]"
    - "count[1]"
    - "count[2]"
    - "count[3]"
    - "count[4]"
    - "count[5]"
    - "count[6]"
    - "count[7]"
  uio_in:
    - "none"
    - "none"
    - "none"
    - "none"
    - "none"
    - "none"
    - "none"
    - "none"
  uio_out:
    - "none"
    - "none"
    - "none"
    - "none"
    - "none"
    - "none"
    - "none"
    - "none"
  uio_oe:
    - "none"
    - "none"
    - "none"
    - "none"
    - "none"
    - "none"
    - "none"
    - "none"

yaml_version: 6
