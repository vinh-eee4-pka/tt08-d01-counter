# Tiny Tapeout project information
project:
  title:        "8-bit Universal Counter"
  author:       "Luu Quoc Vinh"
  discord:      ""
  description:  "8-bit universal binary counter with up/down, load, and hold functionality."
  language:     "Verilog"
  clock_hz:     10000000

  tiles:        "1x1"
  top_module:   "tt_um_d01_counter"

  source_files:
    - "tt_um_d01_counter.v"

  how_it_works: "An 8-bit binary counter with enable, up/down direction, and direct load inputs."
  how_to_test:  "Apply clock and reset_n high, toggle en/up_down/load pins to verify counting logic."
  external_hardware: "None"
  doc_link:     ""

pinout:
  ui[0]: "en"
  ui[1]: "up_down"
  ui[2]: "load"
  ui[3]: "none"
  ui[4]: "none"
  ui[5]: "none"
  ui[6]: "none"
  ui[7]: "none"

  uo[0]: "count[0]"
  uo[1]: "count[1]"
  uo[2]: "count[2]"
  uo[3]: "count[3]"
  uo[4]: "count[4]"
  uo[5]: "count[5]"
  uo[6]: "count[6]"
  uo[7]: "count[7]"

  uio[0]: "d_in[0]"
  uio[1]: "d_in[1]"
  uio[2]: "d_in[2]"
  uio[3]: "d_in[3]"
  uio[4]: "d_in[4]"
  uio[5]: "d_in[5]"
  uio[6]: "d_in[6]"
  uio[7]: "d_in[7]"

yaml_version: 6
